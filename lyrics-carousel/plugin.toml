# Carrusel de letras sincronizadas en la terminal, al estilo de cava/unimatrix.
#
# Lee el reproductor MPRIS con playerctl, busca la letra (LRCLIB, NetEase y el
# adaptador de fuentes del plugin Lyrics de Noctalia) y la dibuja en una
# ventana flotante de kitty con desplazamiento vertical.
#
# Ajustes: aqui solo queda el icono de la barra. El resto se cambia en el panel
# del plugin (el que se abre desde el widget), que es el sitio que el usuario
# tiene a mano. Declararlos aqui los duplicaba: la pagina de ajustes de Noctalia
# y el panel ofrecian lo mismo con dos limites distintos, y los valores se
# leian por dos caminos. Noctalia conserva en el settings.toml las claves
# guardadas aunque no esten declaradas, y el panel las lee de ahi (ver
# lib/settings.luau y `set-setting.py read`), asi que nada se pierde.
#
# El script de Python lee esos mismos ajustes del settings.toml, mas un fichero
# de overrides que escribe el panel para los interruptores rapidos.

id = "faminec/lyrics-carousel"
name = "Lyrics Carousel"
version = "2.7.1"
plugin_api = 34
author = "faminec"
license = "MIT"
dependencies = ["kitty", "hyprland", "hyprctl", "playerctl", "python3", "python-pillow", "fc-match"]
tags = ["music", "system", "utility", "media"]
icon = "music"
description = "Synced lyrics in a floating terminal window with karaoke and a large active line."

# Lo unico que no esta en el panel: el icono es del widget de la barra, que se
# configura en esta pagina y no en la ventana de letras.
[[setting]]
key = "glyph"
type = "glyph"
label_key = "settings.glyph.label"
description_key = "settings.glyph.description"
default = "music"

[[widget]]
id = "widget"
entry = "widget.luau"

[[panel]]
id = "panel"
entry = "panel.luau"
width = 470
height = 760
placement = "attached"
open_near_click = true
# El panel tiene campos de texto (X e Y): si se cierra al pulsar fuera, el
# usuario pierde lo que estaba escribiendo. Con foco exclusivo, las teclas
# (incluidas las de la ventana de letras) no se escapan al escritorio.
dismiss_on_outside_click = false
keyboard_focus = "exclusive"
