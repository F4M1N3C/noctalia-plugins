# Fork del plugin oficial `noctalia/notes` (MIT) con sincronización en vivo.
#
# Añade un vigilante de la carpeta de notas: los cambios hechos fuera del panel
# (app móvil `notes-mobile`, Syncthing, un editor de texto...) se reflejan
# solos, y expone un handler `onIpc` para que otras herramientas refresquen el
# panel o abran una nota concreta.

id = "faminec/notes"
name = "Notes"
version = "1.1.0"
plugin_api = 26
author = "faminec"
license = "MIT"
dependencies = []
tags = ["productivity", "utility", "launcher"]
icon = "notes"
description = "Quick text notes in a side panel, with live sync from the mobile app."

[[setting]]
key = "notes_dir"
type = "folder"
label_key = "settings.notes_dir.label"
description_key = "settings.notes_dir.description"
default = "~/Documents/Notes"

[[setting]]
key = "extension"
type = "string"
label_key = "settings.extension.label"
description_key = "settings.extension.description"
default = "md"

[[setting]]
key = "watch"
type = "bool"
label_key = "settings.watch.label"
description_key = "settings.watch.description"
default = true

[[panel]]
id = "panel"
entry = "panel.luau"
width = 420
height = "fill"
placement = "floating"
position = "center_right"

[[launcher_provider]]
id = "launcher"
entry = "launcher.luau"
prefix = "nt"
glyph = "notes"
include_in_global_search = false

[[widget]]
id = "notes"
entry = "notes.luau"

  [[widget.setting]]
  key = "glyph"
  type = "glyph"
  label_key = "settings.glyph.label"
  default = "notes"
