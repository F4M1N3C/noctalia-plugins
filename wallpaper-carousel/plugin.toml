# Carrusel de fondos con tarjetas verticales y recorte parallax.
# El botón de la barra abre un panel a pantalla completa; las miniaturas se
# generan en caché con Python/Pillow y se recortan según la posición de cada
# tarjeta.

id = "faminec/wallpaper-carousel"
name = "Wallpaper Carousel"
version = "1.0.0"
plugin_api = 34
author = "faminec"
license = "MIT"
dependencies = ["python3", "python-pillow"]
tags = ["wallpaper", "utility", "panel", "desktop"]
icon = "wallpaper"
description = "Full-screen wallpaper carousel with vertical cards, a parallax crop and a bar button."

[[setting]]
key = "directory"
type = "string"
label_key = "settings.directory.label"
description_key = "settings.directory.description"
default = ""

[[setting]]
key = "glyph"
type = "glyph"
label_key = "settings.glyph.label"
description_key = "settings.glyph.description"
default = "wallpaper"

[[setting]]
key = "card_scale"
type = "double"
label_key = "settings.card_scale.label"
description_key = "settings.card_scale.description"
default = 1.0
min = 0.7
max = 1.4

[[setting]]
key = "gap"
type = "int"
label_key = "settings.gap.label"
description_key = "settings.gap.description"
default = 18
min = 4
max = 48

[[setting]]
key = "visible"
type = "int"
label_key = "settings.visible.label"
description_key = "settings.visible.description"
default = 9
min = 3
max = 11

[[setting]]
key = "parallax"
type = "double"
label_key = "settings.parallax.label"
description_key = "settings.parallax.description"
default = 1.0
min = 0.0
max = 1.5

[[setting]]
key = "close_on_apply"
type = "bool"
label_key = "settings.close_on_apply.label"
description_key = "settings.close_on_apply.description"
default = true

[[setting]]
key = "apply_all"
type = "bool"
label_key = "settings.apply_all.label"
description_key = "settings.apply_all.description"
default = true

[[setting]]
key = "show_filenames"
type = "bool"
label_key = "settings.show_filenames.label"
description_key = "settings.show_filenames.description"
default = true

[[widget]]
id = "button"
entry = "widget.luau"

[[panel]]
id = "panel"
entry = "panel.luau"
width = "fill"
height = "fill"
placement = "floating"
position = "center"
keyboard_focus = "exclusive"
capture_keys = ["Escape", "Left", "Right", "Return", "space", "Home", "End", "h", "l", "j", "k", "r"]
dismiss_on_outside_click = false
layer = "overlay"
